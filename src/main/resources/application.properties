spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
hibernate.dialect=org.hibernate.dialect.HSQLDialect
,
# Define a estratégia de criação/atualização do schema do banco de dados.
# Opções: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Exibe no console as queries SQL executadas pelo Hibernate
spring.jpa.show-sql=true

# Formata as queries SQL exibidas no console (facilita a leitura)
spring.jpa.format-sql=true